<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>First Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400&display=swap" rel="stylesheet" />

  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background-color: #f5f5f5;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Full-width black bar */
    .top-bar {
      width: 100%;
      height: 60px;
      background-color: #000;
    }

    /* Centered container */
    .login-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    h1 {
      font-size: 32pt;
      font-weight: 300; /* thin, elegant */
      color: #111;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
      text-transform: none; /* no uppercase */
    }

    input {
      width: 280px;
      padding: 12px 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14pt;
      font-family: "Poppins", sans-serif;
      font-weight: 300;
      text-align: center;
      outline: none;
      transition: border 0.3s ease;
      color: #333;
    }

    input::placeholder {
      color: #999;
      font-weight: 300;
    }

    input:focus {
      border-color: #000;
    }

    /* Proceed button */
    button {
      margin-top: 20px;
      width: 280px;
      padding: 12px;
      background-color: #000;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 16pt;
      font-family: "Poppins", sans-serif;
      font-weight: 300;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #222;
    }
  </style>

  <!-- Supabase via CDN (non-ESM) -->
  <!-- Supabase docs recommend this CDN include.  [oai_citation:0‡Supabase](https://supabase.com/docs/reference/javascript/installing) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <div class="top-bar"></div>

  <div class="login-container">
    <h1>First Login</h1>

    <input id="username" type="text" placeholder="Username (number)" autocomplete="username" />
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" />

    <div id="message" style="min-height: 1.2em; color: #b00020; font-weight: 300;"></div>

    <button id="loginBtn" type="button">Proceed</button>
  </div>

  <script>
    // If you prefer ESM (+esm) imports, note there have been reported issues with jsDelivr +esm and supabase-js v2 in some setups.  [oai_citation:1‡GitHub](https://github.com/orgs/supabase/discussions/41118?utm_source=chatgpt.com)

    // ✅ Put your Supabase project URL and anon key here:
    const SUPABASE_URL = "https://ubfefmnialyjfvgpltfe.supabase.co";
    const SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InViZmVmbW5pYWx5amZ2Z3BsdGZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI1NzcwNDksImV4cCI6MjA3ODE1MzA0OX0.TavsnW_vyrgpq-hy6U4maNi4tNU2aZ99uRExVJtLRU4";

    // supabase-js loaded globally from CDN:
    const { createClient } = window.supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const msg = document.getElementById("message");
    const loginBtn = document.getElementById("loginBtn");
    const usernameEl = document.getElementById("username");
    const passwordEl = document.getElementById("password");

    function setMessage(text) {
      if (msg) msg.textContent = text || "";
    }

    function goToMainPage() {
      window.location.href = "hello.html";
    }

    async function handleLogin() {
      setMessage("");

      // Username is numeric (1,2,3,4...), stored in users.id
      const usernameId = Number(usernameEl.value);
      const password = passwordEl.value ?? "";

      if (!Number.isFinite(usernameId)) {
        setMessage("Enter a numeric username (e.g., 1, 2, 3).");
        return;
      }

      try {
        // ✅ One query: fetch stored password from users.info
        const { data, error } = await supabaseClient
          .from("users")
          .select("id, info")
          .eq("id", usernameId)
          .maybeSingle(); // null if not found

        if (error) throw error;

        if (!data) {
          setMessage("Incorrect username/password pair");
          return;
        }

        const storedPassword = data.info;

        if (password === storedPassword) {
          goToMainPage();
        } else {
          setMessage("Incorrect username/password pair");
        }
      } catch (e) {
        console.error(e);
        setMessage("Login error (check console).");
      }
    }

    loginBtn.addEventListener("click", handleLogin);

    // Optional: press Enter to submit from either input
    usernameEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleLogin();
    });
    passwordEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleLogin();
    });
  </script>
</body>
</html>
