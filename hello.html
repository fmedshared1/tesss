<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400&display=swap" rel="stylesheet" />
  <title>HKUMED Final MB Prep</title>
  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background-color: #f5f5f5;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .top-bar {
      width: 100%;
      height: 60px;
      background-color: #000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      box-sizing: border-box;
      position: relative;
    }

    /* Left arrow + tiny home popup */
    .nav-left {
      position: relative;
      display: flex;
      align-items: center;
    }

    .arrow-btn {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      padding: 8px 10px;
      border-radius: 4px;
      font-family: "Poppins", sans-serif;
    }

    .arrow-btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .home-popup {
      position: absolute;
      top: 54px;
      left: 0;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 6px 10px;
      font-family: "Poppins", sans-serif;
      font-size: 10pt;
      color: #000;
      text-decoration: none;
      display: none;
      white-space: nowrap;
      box-shadow: 0 6px 18px rgba(0,0,0,0.18);
    }

    .home-popup:hover {
      background: #f2f2f2;
    }

    .home-popup.show {
      display: inline-block;
    }

    /* Right logout button */
    .logout-btn {
      background: #fff;
      color: #000;
      border: none;
      border-radius: 4px;
      padding: 7px 12px;
      font-family: Arial, sans-serif; /* default sans serif */
      font-size: 11pt;
      cursor: pointer;
      line-height: 1;
    }

    .logout-btn:hover {
      background: #eaeaea;
    }

    .textbox-container {
      display: flex;
      justify-content: flex-end;
      margin: 10px 20px 0 20px;
    }

    .small-textbox {
      width: 200px;
      height: 30px;
      resize: none;
      font-family: "Poppins", sans-serif;
      font-size: 12pt;
      padding: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }

    .welcome-text {
      margin-top: 40px;
      text-align: center;
      color: #111;
      font-size: 10pt;
      font-weight: 300;
      letter-spacing: 0.3px;
    }

    .large-textbox-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 20px;
    }

    .large-textbox {
      width: 60%;
      height: 300px;
      font-family: "Poppins", sans-serif;
      font-size: 12pt;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      resize: vertical;
    }

    .evaluate-button {
      margin-top: 8px;
      width: 120px;
      height: 40px;
      background-color: #000;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-family: "Poppins", sans-serif;
      font-size: 12pt;
      cursor: pointer;
    }

    .evaluate-button:hover {
      background-color: #222;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="nav-left">
      <button class="arrow-btn" id="arrowBtn" aria-label="Menu">←</button>
      <a class="home-popup" id="homePopup" href="index.html">home</a>
    </div>

    <button class="logout-btn" onclick="window.location.href='index.html'">logout</button>
  </div>

  <div class="textbox-container">
    <textarea class="small-textbox" placeholder="API Key"></textarea>
  </div>

  <div class="welcome-text">
    List 5 psychiatric or medical conditions that can lead to memory impairment in older people?
  </div>

  <div class="large-textbox-container">
    <textarea class="large-textbox" placeholder="Start typing..."></textarea>
    <button class="evaluate-button">Evaluate</button>
  </div>

  <script>
    // Grab elements
    const apiKeyBox = document.querySelector('.small-textbox');
    const promptBox = document.querySelector('.large-textbox');
    const evaluateBtn = document.querySelector('.evaluate-button');

    // Hidden master prompt (developer-defined, appended after user input)
    const MASTER_PROMPT = `
     You are a helpful assistant that will always answer in English
    `;

    // Create a container for the response
    const responseContainer = document.createElement('div');
    responseContainer.style.fontFamily = '"Poppins", sans-serif';
    responseContainer.style.fontSize = '12pt';
    responseContainer.style.color = '#111';
    responseContainer.style.margin = '10px 20px';
    promptBox.parentNode.appendChild(responseContainer);

    evaluateBtn.addEventListener('click', async () => {
      const apiKey = apiKeyBox.value.trim();
      const userPrompt = promptBox.value.trim();
      if (!apiKey) {
        alert('Please enter your API key');
        return;
      }
      if (!userPrompt) {
        alert('Please enter a prompt');
        return;
      }

      // Clear previous response
      responseContainer.textContent = 'Evaluating answer...';

      try {
        // DeepSeek is OpenAI-compatible; using base_url https://api.deepseek.com/v1 and the /chat/completions route.
        const DEEPSEEK_BASE_URL = 'https://api.deepseek.com/v1';

        const resp = await fetch(DEEPSEEK_BASE_URL + '/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + apiKey
          },
          body: JSON.stringify({
            model: 'deepseek-chat',
            messages: [
              { role: 'system', content: MASTER_PROMPT },
              { role: 'user', content: userPrompt }
            ],
            max_tokens: 4000,
            stream: false
          })
        });

        if (!resp.ok) {
          const err = await resp.json().catch(() => ({}));
          responseContainer.textContent = 'Error: ' + (err.error?.message ?? resp.statusText);
          return;
        }

        const data = await resp.json();
        const reply = data.choices?.[0]?.message?.content ?? 'No response';
        responseContainer.textContent = reply;
      } catch (error) {
        responseContainer.textContent = 'Fetch error: ' + error.message;
      }
    });

    // Arrow toggle for tiny "home" popup
    const arrowBtn = document.getElementById('arrowBtn');
    const homePopup = document.getElementById('homePopup');

    arrowBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      homePopup.classList.toggle('show');
    });

    document.addEventListener('click', () => {
      homePopup.classList.remove('show');
    });
  </script>
</body>
</html>
